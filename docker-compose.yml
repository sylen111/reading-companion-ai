services:
  backend:
    build: ./backend
    container_name: reading-companion-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate

  frontend:
    build: ./frontend
    container_name: reading-companion-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend